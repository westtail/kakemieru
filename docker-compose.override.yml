# ローカル開発専用の設定
# docker compose up で自動的に読み込まれる（本番・CIには影響しない）

services:
  web:
    build:
      target: development
    user: "1000:1000"
    # サーバ起動前に Tailwind を一度ビルドして builds/tailwind.css を用意する
    # （初回レンダリングの Propshaft MissingAsset を防ぐ。以降の再ビルドは css サービスが担当）。
    command: bash -c "bin/rails tailwindcss:build && bundle exec rails server -b 0.0.0.0 -p 3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # system spec は別コンテナの Chrome にリモート接続する（この env の有無でリモート判定）。
      CHROME_HOST: chrome
    volumes:
      # ソースコードをマウント（コード変更を即時反映）
      - .:/rails
      # Gem キャッシュをボリュームに分離（毎回 bundle install を防ぐ）
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  # Tailwind CSS の watch ビルド（app/assets/tailwind → app/assets/builds/tailwind.css）。
  # foreman/Procfile.dev は使わず、web と並走する専用サービスとして起動する。
  css:
    build:
      target: development
    user: "1000:1000"
    command: bundle exec rails tailwindcss:watch
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      - web

  db:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kakemieru_development}
    ports:
      # ローカルから直接 DB に接続できるようにポートを公開
      - "5432:5432"

  # システム spec（E2E）用の Chrome。CDP（リモートデバッグ）を 9222 で公開し、
  # web コンテナの Cuprite/Ferrum が http://chrome:9222 で接続する。
  chrome:
    image: zenika/alpine-chrome:latest
    # /dev/shm 不足によるクラッシュを防ぐ
    shm_size: 2g
    command:
      - --headless
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
    ports:
      # ホストからの CDP デバッグ用（任意）
      - "9222:9222"

volumes:
  bundle_cache:
