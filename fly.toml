# fly.toml app configuration file generated for kakemieru on 2026-03-28T23:01:23+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kakemieru'
primary_region = 'nrt'
console_command = '/rails/bin/rails console'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 常駐ワーカーを持たない（メールは deliver_now で同期送信）ため、使わない時間はゼロ台まで落とす。
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # 常駐ワーカーが無く Rails プロセスは Puma 1つだけなので 256MB で足りる。
  memory = '256mb'
  cpus = 1
