# fly.toml app configuration file generated for kakemieru on 2026-03-28T23:01:23+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kakemieru'
primary_region = 'nrt'
console_command = '/rails/bin/rails console'

[env]
  # solid_queue のワーカーを Puma プロセス内で動かす（別マシン不要）。
  SOLID_QUEUE_IN_PUMA = 'true'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # solid_queue のワーカーを Puma 内で常時動かすため 1台は落とさない。
  # 0 だとアイドル停止中にジョブ（パスワードリセットメール等）が処理されず遅延する。
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
